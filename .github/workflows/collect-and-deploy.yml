name: Collect AI news (free)

on:
  schedule:
    # 09:17 / 21:17 Korea Standard Time (UTC+9); schedules may be delayed.
    - cron: '17 0,12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: signal-desk-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh main to avoid stale rerun conflicts
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Run freshness and deduplication tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Collect official public feeds
        run: python scripts/collect.py
      - name: Save feed when changed (retry on concurrent code commits)
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No changes to the public news feed"
            exit 0
          fi
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp)"
          cp data/news.json "$snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" data/news.json
            if git diff --quiet -- data/news.json; then
              echo "Feed already up to date"
              rm -f "$snapshot"
              exit 0
            fi
            git add data/news.json
            git commit -m "chore: refresh AI news feed [skip ci]"
            if git push origin main; then
              rm -f "$snapshot"
              exit 0
            fi
            echo "Concurrent update; retrying ($attempt/3)"
            sleep "$attempt"
          done
          rm -f "$snapshot"
          exit 1
