name: Collect AI news (free)

on:
  schedule:
    # 09:17 / 21:17 Korea Standard Time (UTC+9); schedules may be delayed.
    - cron: '17 0,12 * * *'
  workflow_dispatch:
    inputs:
      discord_send:
        description: 'Post Discord digest now (requires DISCORD_WEBHOOK_URL; sends 3-5 unseen stories)'
        type: boolean
        required: false
        default: false
      discord_test_send:
        description: 'Send ONE labeled test digest (can reuse posted articles; keeps normal ledger intact)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: signal-desk-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh main to avoid stale rerun conflicts
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Run freshness and deduplication tests
        run: python -m unittest discover -s tests -p 'test_*.py' -q
      - name: Collect official public feeds
        run: python scripts/collect.py
      - name: Generate evidence-based briefing (optional Gemini free tier)
        run: python scripts/briefing.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Preview Discord digest safely (never sends)
        run: python scripts/discord_post.py --dry-run
      - name: Save feed when changed (retry on concurrent code commits)
        run: |
          if git diff --quiet -- data/news.json data/briefing.json; then
            echo "No changes to the public news feed"
            exit 0
          fi
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp -d)"
          cp data/news.json "$snapshot/news.json"
          cp data/briefing.json "$snapshot/briefing.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot/news.json" data/news.json
            cp "$snapshot/briefing.json" data/briefing.json
            if git diff --quiet -- data/news.json data/briefing.json; then
              echo "Feed already up to date"
              rm -rf "$snapshot"
              exit 0
            fi
            git add data/news.json data/briefing.json
            git commit -m "chore: refresh AI news feed [skip ci]"
            if git push origin main; then
              rm -rf "$snapshot"
              exit 0
            fi
            echo "Concurrent update; retrying ($attempt/3)"
            sleep "$attempt"
          done
          rm -rf "$snapshot"
          exit 1

      - name: Send clearly labeled Discord test (never changes delivery ledger)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.discord_test_send) || (github.event_name == 'push' && github.event.head_commit.message == 'test-send-one-labeled-discord-preview-20261110-kst') }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SIGNAL_DESK_TEST_SEND: '1'
        run: python scripts/discord_post.py --test-send
      - name: Post Discord digest (scheduled or manually enabled only)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.discord_send && !inputs.discord_test_send) }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/discord_post.py
      - name: Persist Discord delivered-item ledger
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.discord_send && !inputs.discord_test_send) }}
        run: |
          if git diff --quiet -- data/discord_state.json; then
            echo "No Discord message sent; ledger unchanged"
            exit 0
          fi
          git config user.name "signal-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$(mktemp)"
          cp data/discord_state.json "$snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" data/discord_state.json
            if git diff --quiet -- data/discord_state.json; then
              echo "Ledger already saved"
              rm -f "$snapshot"
              exit 0
            fi
            git add data/discord_state.json
            git commit -m "chore: record sent Discord stories [skip ci]"
            if git push origin main; then
              rm -f "$snapshot"
              exit 0
            fi
            echo "Concurrent update; retrying Discord ledger ($attempt/3)"
            sleep "$attempt"
          done
          rm -f "$snapshot"
          exit 1
