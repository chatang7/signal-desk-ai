<div class="wide-panel" style="margin:0"><div class="panel-head"><h2>최종 문안 편집</h2><span class="minor">작성 내용은 이 브라우저에 보관</span></div><div class="form-field" style="margin-bottom:6px"><textarea class="textarea-large" id="discord-text" placeholder="왼쪽에서 '자동 요약 초안 생성'을 눌러 시작하세요.">${esc(draftText)}</textarea></div><div class="counter ${draftText.length>2000?'over':''}" id="discord-counter"><span>Discord 일반 메시지 권장 한도: 2,000자</span><b>${draftText.length.toLocaleString('ko-KR')} / 2,000</b></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="copy-discord">▣ 문안 복사</button><button class="btn" id="download-discord">↓ TXT 저장</button><button class="btn ghost" id="clear-discord">초기화</button></div><div class="floating-summary">초안 생성은 <b>발췌·길이 제한 방식</b>입니다. 실제 의미 검증이나 AI 재작성 기능은 현재 연결하지 않았습니다. 긴 원문은 직접 재검토하세요.</div></div></div>`}
function renderSettings(){return `${pageHero('OPERATIONS & GOVERNANCE / 04','설계된 것과 미정인 것','연결되지 않은 자동화를 완성된 기능처럼 보이지 않도록 구분합니다.')}
<div class="wide-panel"><div class="panel-head"><h2>지금 작동하는 기능</h2><span class="minor">로컬 브라우저 저장</span></div><div class="settings-grid"><div class="setting ready"><h3>공개 API 자동 수집</h3><p>활성화된 GitHub 릴리스·Hugging Face 논문 목록을 열 때/주기적으로 확인합니다. 브라우저가 닫혀 있으면 실행되지 않습니다.</p><span class="flag">사용 가능</span></div><div class="setting ready"><h3>뉴스 입력 및 분류</h3><p>17개 임시 카테고리와 한국·해외·글로벌 구분, 8개 뉴스 세부 필드, 공식 링크 입력을 지원합니다.</p><span class="flag">사용 가능</span></div><div class="setting ready"><h3>중복 후보 자동 묶기</h3><p>정규화한 동일 URL, 높은 제목 유사도, 수동 이슈 ID를 사용합니다. 원본은 삭제하지 않습니다.</p><span class="flag">규칙 기반 사용 가능</span></div><div class="setting ready"><h3>우선순위 및 검토 상태</h3><p>중요도 45%, 신뢰도 35%, 최신성 20% 임시 가중 점수. 검토 단계와 무료·저비용 필터를 제공합니다.</p><span class="flag">사용 가능</span></div><div class="setting ready"><h3>Discord 문안 편집</h3><p>요약 초안 생성, 수정, 복사, TXT 다운로드를 지원합니다. 자동 게시 기능은 포함하지 않습니다.</p><span class="flag">사용 가능</span></div></div><div class="divider"></div><div class="panel-head"><h2>미정 · 향후 결정할 사항</h2><span class="minor">연결 전까지 활성화하지 않음</span></div><div class="settings-grid"><div class="setting"><h3>일일 브리핑 자동 수집</h3><p>ChatGPT 예약 브리핑 결과를 사이트로 자동 전달하는 공식 경로·인증·전송 방식이 아직 결정되지 않았습니다. 별도의 GitHub/논문 공개 API 수집은 사용 가능합니다.</p><span class="flag">미정</span></div><div class="setting"><h3>AI 의미 기반 중복 판별</h3><p>의미가 같지만 표현이 다른 해외·국내 보도를 묶을 모델, 비용과 정확도 검증이 미정입니다.</p><span class="flag">미정</span></div><div class="setting"><h3>Discord 자동 게시</h3><p>웹훅, 봇 토큰 보관, 승인 절차, 전송 주기 및 중복 방지 규칙이 결정되지 않았습니다.</p><span class="flag">미정</span></div><div class="setting"><h3>분류·저비용 경계</h3><p>카테고리 통합·분할 여부, '저비용'의 정량 기준과 신뢰도 자동 평가 방식이 미정입니다.</p><span class="flag">미정</span></div><div class="setting"><h3>다중 기기 동기화</h3><p>현재는 브라우저에만 저장됩니다. 계정 로그인, 데이터베이스, 접근 권한 설계가 미정입니다.</p><span class="flag">미정</span></div><div class="setting"><h3>출처 주장 자동 검증</h3><p>GitHub 릴리스 원문과 논문 링크는 가져오지만 성능 수치 대조, 주장 재검증, 정책 변경 추적은 자동화되지 않았습니다.</p><span class="flag">미정</span></div></div><div class="divider"></div><div class="panel-head"><h2>데이터 관리</h2><span class="minor">백업 권장</span></div><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn primary" id="export-json">↓ 전체 데이터 JSON 백업</button><button class="btn" id="export-csv">↓ 뉴스 CSV 내보내기</button><button class="btn" data-open="import">⇧ 데이터 가져오기</button><button class="btn" id="sample">▤ 샘플 뉴스 넣기</button><button class="btn danger" id="clear-all">모든 뉴스 삭제</button></div><div class="floating-summary">브라우저 데이터 삭제·시크릿 모드·다른 기기 사용 시 내용이 유지되지 않을 수 있습니다. 중요한 브리핑은 JSON으로 정기 백업하세요.</div></div>`}
function attachView(){const content=document.getElementById('page-content');if(view==='news'){const search=document.getElementById('search');search?.addEventListener('input',e=>{filters.q=e.target.value;const p=search.selectionStart;render();const fresh=document.getElementById('search');fresh?.focus();fresh?.setSelectionRange(p,p)});[['filter-topic','topic'],['filter-region','region'],['filter-sort','sort']].forEach(([id,k])=>document.getElementById(id)?.addEventListener('change',e=>{filters[k]=e.target.value;render()}));document.getElementById('cheap-filter')?.addEventListener('change',e=>{filters.cheap=e.target.checked;render()});document.getElementById('collapse-filter')?.addEventListener('change',e=>{filters.collapse=e.target.checked;render()});content.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>{filters.status=b.dataset.status;render()}));content.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{filters.topic=b.dataset.category;render()}))}
if(view==='discord'){document.getElementById('discord-limit')?.addEventListener('change',e=>{discordLimit=Number(e.target.value);render()});document.getElementById('discord-only-selected')?.addEventListener('change',e=>{selectedOnly=e.target.checked;render()});document.getElementById('discord-links')?.addEventListener('change',e=>{includeLinks=e.target.checked;render()});document.getElementById('generate-draft')?.addEventListener('click',()=>{draftText=composeDraft();persistDraft();render();toast('초안 생성됨. 게시 전에 문안을 검토하세요.')});document.getElementById('discord-text')?.addEventListener('input',e=>{draftText=e.target.value;persistDraft();const cc=document.getElementById('discord-counter');cc.classList.toggle('over',draftText.length>2000);cc.querySelector('b').textContent=`${draftText.length.toLocaleString('ko-KR')} / 2,000`});document.getElementById('copy-discord')?.addEventListener('click',async()=>{if(!draftText.trim())return toast('복사할 문안이 없습니다.');try{await navigator.clipboard.writeText(draftText);toast('Discord 문안이 복사되었습니다.')}catch{const t=document.getElementById('discord-text');t.select();document.execCommand('copy');toast('문안 복사를 시도했습니다.')}});document.getElementById('download-discord')?.addEventListener('click',()=>downloadFile('discord-brief-'+nowISO()+'.txt',draftText,'text/plain;charset=utf-8'));document.getElementById('clear-discord')?.addEventListener('click',()=>{if(!confirm('작성한 Discord 문안을 지울까요?'))return;draftText='';persistDraft();render()})}
if(view==='sync'){document.getElementById('hosted-now')?.addEventListener('click',()=>runHostedSync(true));document.getElementById('sync-now')?.addEventListener('click',()=>runPublicSync(true));document.getElementById('sync-auto')?.addEventListener('change',e=>{syncCfg.auto=e.target.checked;persistSync();render()});content.querySelectorAll('[data-sync-source]').forEach(el=>el.addEventListener('change',e=>{const n=el.dataset.syncSource;if(e.target.checked){if(!syncCfg.enabled.includes(n))syncCfg.enabled.push(n)}else syncCfg.enabled=syncCfg.enabled.filter(x=>x!==n);persistSync();render()}));document.getElementById('sync-url-save')?.addEventListener('click',()=>{const u=document.getElementById('sync-url').value.trim();if(u){try{const parsed=new URL(u);if(parsed.protocol!=='https:'||parsed.username||parsed.password)throw Error();}catch{return toast('인증 정보 없는 HTTPS 주소만 입력하세요.')}}syncCfg.feedUrl=u;persistSync();toast('JSON 피드 주소가 저장되었습니다.');render()})}
if(view==='settings'){document.getElementById('export-json')?.addEventListener('click',()=>downloadFile('signal-desk-backup-'+nowISO()+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),items},null,2),'application/json'));document.getElementById('export-csv')?.addEventListener('click',exportCSV);document.getElementById('sample')?.addEventListener('click',addSamples);document.getElementById('clear-all')?.addEventListener('click',()=>{if(confirm('모든 뉴스 데이터를 삭제합니다. 복구할 수 없습니다. 먼저 JSON으로 백업했나요?')&&confirm('정말 삭제하시겠습니까?')){items=[];persist();render();toast('뉴스가 모두 삭제되었습니다.')}})}
}
function downloadFile(filename,content,mime){const b=new Blob(['\ufeff',content],{type:mime});const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function exportCSV(){const keys=['title','date','topic','region','summary','difference','why','usage','cost','performance','pricing','importance','reliability','status','urls','notes','groupKey'];const label=['제목','날짜','분류','지역','핵심 내용','기존 기술과의 차이','중요한 이유','실제 활용 가능성','비용','성능 수치','가격 등급','중요도','신뢰도','검토 상태','공식 출처 링크','메모','이슈 ID'];const cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"';const csv=[label.map(cell).join(','),...items.map(x=>keys.map(k=>cell(k==='urls'?x.urls.join(' | '):x[k])).join(','))].join('\r\n');downloadFile('signal-desk-news-'+nowISO()+'.csv',csv,'text/csv;charset=utf-8')}
function addSamples(){if(!confirm('가상 샘플 뉴스 4건을 추가할까요? 실제 뉴스가 아니며 언제든 삭제할 수 있습니다.'))return;const base=defaults();const make=(title,topic,summary,why,price,days)=>({...base,id:id(),title:'[샘플] '+title,topic,summary,why,pricing:price,date:new Date(Date.now()-days*86400000).toLocaleDateString('sv-SE')});items.unshift(make('가상 AI 모델 A 2.0 공개','모델 출시','예시 데이터: 추론 성능과 비용을 비교해야 하는 신모델 발표입니다.','성능 숫자뿐 아니라 실제 가격과 라이선스를 확인해야 합니다.','미정',0),make('가상 AI 모델 A 2.0 출시 소식','모델 출시','예시 데이터: 위 소식과 중복되는 보도입니다.','동일 발표이므로 한 묶음으로 검토합니다.','미정',0),make('가상 오픈소스 코딩 에이전트 공개','GitHub 오픈소스','예시 데이터: 코드 검색과 자동 수정 기능을 가진 프로젝트입니다.','무료 도구의 실제 라이선스와 테스트 안정성이 중요합니다.','무료',1),make('가상 음성 합성 도구 할인','음성 생성','예시 데이터: 저비용으로 음성 생성 기능을 제공하는 가상 상품입니다.','초기 가격이 아닌 사용량에 따른 비용을 검토합니다.','저비용',2));items[0].importance=5;items[2].importance=4;persist();view='news';render();toast('가상 샘플 4건을 추가했습니다.')}
function showModal(title,body,foot){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal-foot').innerHTML=foot;document.getElementById('modal-layer').classList.add('show')}
function closeModal(){document.getElementById('modal-layer').classList.remove('show')}
function field(name,label,value='',options=null,hint='',type='text'){return `<div class="form-field"><label for="f-${name}">${label}</label>${options?`<select name="${name}" id="f-${name}">${options.map(v=>`<option value="${attr(v)}" ${String(value)===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${name}" id="f-${name}" rows="3">${esc(value)}</textarea>`:`<input type="${type}" name="${name}" id="f-${name}" value="${attr(value)}" ${type==='date'?'':''}/>`}${hint?`<div class="form-hint">${hint}</div>`:''}</div>`}

function renderSync(){const r=syncCfg.lastResult;const latest=r?.log||[];const sourceLine=s=>{const last=latest.find(x=>x.label===s.label);return `<label class="sync-source"><input type="checkbox" data-sync-source="${s.id}" ${syncCfg.enabled.includes(s.id)?'checked':''}/><span><b>${esc(s.label)}</b><small>${esc(s.note)}</small><small>${last?(last.ok?`<span class="sync-ok">정상 · 후보 ${last.count}건</span>`:`<span class="sync-fail">오류 · ${esc(last.err)}</span>`):'아직 실행 기록 없음'}</small></span></label>`};return `${pageHero('AUTOMATED SOURCE MONITOR / 02','무료 백그라운드 뉴스 수집','GitHub Actions가 하루 2번 자동 수집하고, 대시보드는 저장된 뉴스 피드를 조회합니다. ChatGPT 브리핑과의 직접 동기화는 별도 기능입니다.',`<button class="btn primary" id="hosted-now">↻ 저장된 피드 확인</button> <button class="btn" id="sync-now" ${syncBusy?'disabled':''}>${syncBusy?'확인 중…':'공개 API 수동 보충'}</button>`)}
<div class="status-note"><span style="font-size:18px">ⓘ</span><span><strong>자동 수집 범위는 공개 소스로 제한됩니다.</strong> 기존 ChatGPT 예약 브리핑 자동 전송, 국내 기사 전체 수집, AI 검증과 Discord 자동 게시는 <b>미정</b>입니다. <b>GitHub Actions 예약 수집</b>은 코드에 구현했으며, GitHub Pages에 배포된 후 실제 실행을 검증해야 합니다. 사이트를 닫아도 예약 작업은 실행됩니다. 검토 상태는 각 기기의 브라우저에만 저장됩니다.</span></div>
<div class="wide-panel"><div class="panel-head"><h2>GitHub 서버 수집 상태</h2><span class="sync-pill">${syncCfg.hosted?.generatedAt?'최근 생성 '+esc(new Date(syncCfg.hosted.generatedAt).toLocaleString('ko-KR')):'아직 수집 기록 없음'}</span></div><div class="sync-hint">${syncCfg.hosted?.ok?`<b class="sync-ok">저장된 피드 연결 정상</b> · 항목 ${syncCfg.hosted.count}건 · 신규 ${syncCfg.hosted.added}건 · 성공 소스 ${syncCfg.hosted.successfulSources}개 · 오류 ${syncCfg.hosted.failedSources}개`:`<b class="sync-fail">${esc(syncCfg.hosted?.error||'첫 실행 전 또는 사이트 미게시')}</b> · HTML 파일만 실행하면 백그라운드 수집이 작동하지 않습니다. GitHub에 게시된 사이트를 사용하세요.`}</div>${syncCfg.hosted?.sources?.length?`<div class="sync-logs">${syncCfg.hosted.sources.map(x=>`<div class="sync-log"><span>${esc(x.source)}</span><span class="${x.ok?'sync-ok':'sync-fail'}">${x.ok?'후보 '+x.count+'건':esc(x.error||'실패')}</span></div>`).join('')}</div>`:''}</div>
<div class="sync-status"><div class="metric"><div class="metric-title">새로 등록한 뉴스</div><div class="metric-number">${r?.added??'—'}</div><div class="metric-footer">최근 실행 기준</div></div><div class="metric"><div class="metric-title">중복 · 보관됨</div><div class="metric-number">${r?.skipped??'—'}</div><div class="metric-footer">원문 링크/외부 ID 기준</div></div><div class="metric"><div class="metric-title">정상 / 실패 소스</div><div class="metric-number">${r?`${r.ok} / ${r.failed}`:'—'}</div><div class="metric-footer">실패 원인은 아래 기록</div></div></div>
<div class="wide-panel"><div class="panel-head"><h2>수집 동작</h2><span class="sync-pill">마지막 시도 ${fmtKST(syncCfg.lastAttempt)}</span></div><div class="form-field"><label class="checkbox-label"><input type="checkbox" id="sync-auto" ${syncCfg.auto?'checked':''}/> 브라우저가 열려 있을 때 6시간마다 공개 API 추가 수집 (선택)</label></div><div class="sync-hint">GitHub Actions가 브라우저와 무관하게 하루 2회 공개 데이터를 수집합니다. 아래 소스 선택은 사이트에서 추가로 직접 수집할 때만 적용됩니다.</div><div class="divider"></div><div class="panel-head"><h2>공식 공개 소스</h2><span class="minor">선택한 소스만 조회</span></div><div class="sync-list">${SOURCE_DEFS.map(sourceLine).join('')}</div><div class="panel-head"><h2>맞춤형 JSON 브리핑 피드</h2><span class="minor">선택적 연결</span></div><div class="form-field"><label for="sync-url">HTTPS 주소 (없으면 비워 둡니다)</label><input id="sync-url" class="search" style="width:100%" placeholder="https://example.com/ai-briefing.json" value="${attr(syncCfg.feedUrl||'')}"/></div><button class="btn" id="sync-url-save">주소 저장</button><div class="sync-hint">JSON 배열 또는 <code>{"items":[...]}</code> 형식을 수용합니다. 피드 서버는 브라우저 CORS 접근을 허용해야 합니다. <b>비밀번호·개인 API 토큰을 URL에 넣지 마세요.</b> 이 연결을 설정해도 ChatGPT 예약 작업이 자동으로 해당 주소에 쓰는 것은 아닙니다.</div></div>
<div class="wide-panel"><div class="panel-head"><h2>실행 결과</h2><span class="minor">성공 ${r?.ok||0}건 · 오류 ${r?.failed||0}건</span></div>${r?`<div class="sync-logs">${r.log.map(l=>`<div class="sync-log"><span>${esc(l.label)}</span><span class="${l.ok?'sync-ok':'sync-fail'}">${l.ok?'후보 '+l.count+'건':esc(l.err)}</span></div>`).join('')}</div><div class="sync-hint">마지막 정상 응답 ${fmtKST(syncCfg.lastSuccess)} · 실제 저장된 항목 ${items.filter(x=>x.importedFrom==='public-api').length}건 · 자동 수집 값은 사실 검증 완료를 뜻하지 않습니다.</div>`:`<div class="sync-muted">아직 수집을 실행하지 않았습니다. '지금 동기화' 버튼으로 연결을 검사하세요.</div>`}</div>`}

function mergeManualItems(records){const usedIds=new Set(items.map(z=>z.id));const usedLinks=new Set(items.flatMap(z=>(z.urls||[]).map(canonicalUrl)).filter(Boolean));const usedTitles=new Set(items.map(z=>normTitle(z.title)+'|'+z.date));let added=0,skipped=0;for(const record of records){const x=normItem(record);const same=(usedIds.has(x.id)||x.urls.some(u=>usedLinks.has(canonicalUrl(u)))||usedTitles.has(normTitle(x.title)+'|'+x.date));if(same){skipped++;continue}items.push(x);usedIds.add(x.id);x.urls.forEach(u=>usedLinks.add(canonicalUrl(u)));usedTitles.add(normTitle(x.title)+'|'+x.date);added++}if(added)persist();return{added,skipped}}
// Global event delegation for controls recreated on every render.
document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){view=b.dataset.view;render();return}const o=e.target.closest('[data-open]');if(o){o.dataset.open==='import'?openImport():editItem();return}const edit=e.target.closest('[data-edit]');if(edit){editItem(edit.dataset.edit);return}const state=e.target.closest('[data-state]');if(state){const a=items.find(x=>x.id===state.dataset.state);if(a){a.status=state.dataset.to;a.updatedAt=Date.now();persist();render();toast('검토 상태를 변경했습니다.')}return}});
document.addEventListener('change',e=>{const c=e.target.closest('[data-select]');if(c){const a=items.find(x=>x.id===c.dataset.select);if(a){a.selected=c.checked;persist();if(view==='discord')render()}}});
document.querySelectorAll('.nav-btn').forEach(b=>{});document.getElementById('new-top').onclick=()=>editItem();document.getElementById('import-top').onclick=openImport;document.getElementById('sync-top').onclick=()=>{view='sync';render();runHostedSync(true)};document.getElementById('close-modal').onclick=closeModal;document.getElementById('modal-layer').addEventListener('click',e=>{if(e.target.id==='modal-layer')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();setTimeout(()=>{runHostedSync(false);if(syncCfg.auto&&Date.now()-(syncCfg.lastAttempt||0)>=SYNC_INTERVAL)runPublicSync(false)},700);setInterval(()=>{if(document.visibilityState==='visible'){runHostedSync(false);if(syncCfg.auto&&Date.now()-(syncCfg.lastAttempt||0)>=SYNC_INTERVAL)runPublicSync(false)}},30*60*1000);
})();
</script>
</body>
